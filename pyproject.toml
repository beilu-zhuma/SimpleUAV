[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lightning-vln"
version = "0.1.0"
description = "LightningVLN standalone UAV-ON evaluation."
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24,<2",
  "Pillow",
  "msgpack>=1,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
